  "django-stubs>=6.0.7",
  "django-stubs-ext>=6.0.7",
  "django-types>=0.24.0",
  "djangorestframework-stubs>=3.17.1",
  "ruff>=0.16.1",
  "ty>=0.0.65",
]

[tool.ruff.lint]
