dependencies = [
  "django>=6.0.7",
  "django-cors-headers>=4.9.0",
  "django-filter>=26.1",
  "dj-database-url>=3.0",
  "djangorestframework>=3.17.1",
  "djangorestframework-camel-case>=1.4.2",
  "djangorestframework-simplejwt>=5.5.1",
  "drf-spectacular>=0.30.0",
  "gunicorn>=23.0",
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.2.2",
  "whitenoise>=6.8",
]

[dependency-groups]
